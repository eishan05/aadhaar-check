<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Privacy lock. This policy lets the page load only its own script and style
  files and forbids every kind of network connection (fetch, XHR, WebSocket,
  beacons, form submission, images from elsewhere). Even if the code tried to
  send your number somewhere, the browser would block it.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta http-equiv="x-dns-prefetch-control" content="off">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aadhaar Number Checker</title>
<meta name="description" content="Check an Aadhaar number or VID (length, first digit, Verhoeff checksum) entirely in your browser. Nothing is sent anywhere.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23146c43'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="aadhaar.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main class="wrap">

  <header class="masthead">
    <h1>Aadhaar Number Checker</h1>
    <p class="tagline">Runs in your browser. Nothing is sent anywhere. <a href="https://github.com/eishan05/aadhaar-check">Source</a></p>
  </header>

  <section class="card checker" aria-label="Checker">
    <label for="number" class="field-label">Aadhaar number or VID</label>
    <div class="field">
      <input id="number" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="XXXX XXXX XXXX" aria-describedby="status-title status-detail">
      <button id="clear" type="button" class="clear">Clear</button>
    </div>

    <div id="status" class="status state-empty" role="status" aria-live="polite" hidden>
      <span class="status-icon" aria-hidden="true"></span>
      <div>
        <p id="status-title" class="status-title"></p>
        <p id="status-detail" class="status-detail"></p>
      </div>
    </div>

    <ul id="rules" class="rules" aria-label="Checks" hidden></ul>

    <section id="suggestions" class="suggestions" aria-labelledby="suggestions-title" hidden>
      <h2 id="suggestions-title">Did you mean</h2>
      <p class="muted">Check against the card.</p>
      <div id="suggestions-body"></div>
      <p id="copy-status" class="sr-only" role="status" aria-live="polite"></p>
    </section>

    <details id="steps-wrap" class="steps" hidden>
      <summary>Checksum steps</summary>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th scope="col">i</th><th scope="col">digit</th><th scope="col">p(i mod 8, digit)</th><th scope="col">c = d(c, p)</th></tr>
          </thead>
          <tbody id="steps-body"></tbody>
        </table>
      </div>
      <p id="steps-result" class="steps-result"></p>
    </details>
  </section>

  <footer class="foot">
    <p>Not affiliated with UIDAI.</p>
  </footer>

</main>
</body>
</html>
